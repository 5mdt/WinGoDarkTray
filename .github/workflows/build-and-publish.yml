# build-and-publish.yml

name: Build and Publish Go Executable

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  test:
    name: Run Tests Before Build
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Cache Go modules and build cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Set version from git tag
      run: echo "VERSION=$(git describe --tags --always --dirty)" >> $GITHUB_ENV

    - name: Make build script executable
      run: chmod +x ./build.sh

    - name: Build all targets
      run: ./build.sh
      env:
        VERSION: ${{ env.VERSION }}

    - name: Verify build artifacts
      run: |
        ls -la ./build/
        if [ ! -f "./build/WinGoDarkTray-x64.exe" ]; then
          echo "Error: x64 executable not found"
          exit 1
        fi
        if [ ! -f "./build/WinGoDarkTray-x32.exe" ]; then
          echo "Error: x32 executable not found"
          exit 1
        fi
        if [ ! -f "./build/WinGoDarkTray-arm64.exe" ]; then
          echo "Error: ARM64 executable not found"
          exit 1
        fi
        echo "All build artifacts verified successfully"

    - name: Upload Windows Executables to Release
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
      uses: ncipollo/release-action@v1
      with:
        artifacts: './build/WinGoDarkTray-*.exe'
        token: ${{ secrets.GITHUB_TOKEN }}
        generateReleaseNotes: false
        makeLatest: true
        skipIfReleaseExists: false
        removeArtifacts: false
        replacesArtifacts: true
        updateOnlyUnreleased: true

    - name: VirusTotal Scan
      if: env.VT_API_KEY != ''
      uses: crazy-max/ghaction-virustotal@v4
      env:
        VT_API_KEY: ${{ secrets.VT_API_KEY }}
      with:
        vt_api_key: ${{ env.VT_API_KEY }}
        files: |
          ./build/WinGoDarkTray-x32.exe
          ./build/WinGoDarkTray-x64.exe
          ./build/WinGoDarkTray-arm64.exe

    - name: Generate checksums
      run: |
        cd ./build/
        sha256sum *.exe > checksums.txt
        cat checksums.txt

    - name: Upload checksums to release
      if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
      uses: ncipollo/release-action@v1
      with:
        artifacts: './build/checksums.txt'
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        omitBodyDuringUpdate: true
        omitNameDuringUpdate: true
